<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog</title>
    <style>
        header {
            background-color: rgb(5, 57, 126);
            color: #FFFFFF;
            text-align: center;
            max-width: 800px;
            margin: 0 auto;
            padding: 16px;
            border: 5px solid rgb(11, 70, 197);
        }

        main {
            background-color: #fcf6f6;
            color: rgb(0, 0, 0);
            max-width: 800px;
            margin: 0 auto;
            padding: 16px;
            display: flex;
            gap: 16px;
        }

        img {
            width: 100px;
            height: 100px;
        }

        .artigo-autor {
            font-weight: bold;
        }
    </style>
</head>             
<body>
    <header>
        <h1>Meu blog tech</h1>
        <p>Vou compartilhar conhecimento sobre tecnologia e programação</p>
    </header>

    <main>
        <img src="Gemini_Generated_Image_g6momcg6momcg6mo.png" alt="Ilustração do blog">
        <div>
            <h2>Meu primeiro post</h2>
            <p class="artigo-autor">Por: Camila Maciel Henrique</p>
            <p>Boas vindas ao meu primeiro blog! Aqui vou compartilhar dicas de programação e curiosidades da área de tecnologia!</p>
            <button>😎 <span>0</span></button>
            <button>❤️ <span>0</span></button>
        </div>
    </main>

    <script>
        const botoes = document.querySelectorAll("button");

        botoes.forEach(function (botao) {
            let curtiu = false;

            botao.addEventListener("click", botaoClicado);

            function botaoClicado() {
                console.log("fui clicado");
                let texto = botao.querySelector("span");

                if (curtiu === false) {
                    texto.textContent++;
                    curtiu = true;
                } else {
                    texto.textContent--;
                    curtiu = false;
                }
            }
        });
    </script>
</body>
</html>
